name: Build NG DLL
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Configure
        run: xmake f -y -m releasedbg
      - name: Build
        run: xmake build -y -v BakaFullscreenPipboy
      - name: Locate DLL
        shell: bash
        run: find build -name "BakaFullscreenPipboy.dll" -print
      - uses: actions/upload-artifact@v4
        with:
          name: BakaFullscreenPipboy-NG-dll
          path: build/**/BakaFullscreenPipboy.dll
